name: Release

# Every push to main becomes an installable release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so two runs on the same day can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Skip when main is already released. CalVer YYYY.MM.DD.N: N counts the releases of the (UTC) day.
      - id: calver
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "Nothing merged since $(git tag --points-at HEAD | head -1); skipping."
            exit 0
          fi
          today=$(date -u +%Y.%m.%d)
          last=$(git tag --list "${today}.*" | sed "s/^${today}\.//" | sort -n | tail -1)
          echo "version=${today}.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm run build
          # Unzipping gives one "pr-versions" folder to pick in chrome://extensions → Load unpacked.
          # The folder name has no version, so an update can unzip over it and keep Chrome's install.
          mkdir -p release
          cp -R dist release/pr-versions
          cp README.md LICENSE release/pr-versions/
          # The Chrome Web Store wants manifest.json at the zip root, so it gets its own zip of dist/.
          (cd dist && zip -qr "../release/pr-versions_${VERSION}_chrome-web-store.zip" .)
          (cd release && zip -qr "pr-versions_${VERSION}.zip" pr-versions && sha256sum -- *.zip > checksums.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          1. Download \`pr-versions_${VERSION}.zip\` below and unzip it.
          2. Open \`chrome://extensions\` and turn on **Developer mode**.
          3. Click **Load unpacked** and pick the unzipped \`pr-versions\` folder.

          To update, unzip a newer release over the same \`pr-versions\` folder and click reload on the extension card.

          NOTES
          gh release create "$VERSION" release/*.zip release/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes
